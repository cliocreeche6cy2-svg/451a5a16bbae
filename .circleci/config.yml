          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target renderGraph -j2
      - run:
          name: Compile render graph
          command: LIONSS_LP=1 ./build/renderGraph --conf rg.cfg --alias-memory

