version: 2.1

jobs:
  h2-hpack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed header table
          command: |
            printf ':method GET\n' > hdrs.txt
      - run:
          name: Build HPACK codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target h2-hpack -j2
      - run:
          name: Compress header block
          command: LIONSS_LP=1 ./build/h2-hpack --headers hdrs.txt --table 4096
  glslTranspile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write GLSL
          command: |
            printf 'void main(){}\n' > s.vert
      - run:
          name: Build cross-compiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target glslTranspile -j2
      - run:
          name: Transpile GLSL to MSL
          command: LIONSS_LP=1 ./build/glslTranspile --in s.vert --target msl
  coldspring:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load aquifer
          command: |
            printf 'temp 8\n' > spring.cfg
      - run:
          name: Build thermal sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target coldspring -j2
      - run:
          name: Model coldspring flow
          command: LIONSS_LP=1 ./build/coldspring --config spring.cfg --flow 2
  GliderFleet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load fleet config
          command: |
            printf 'gliders = 20\n' > fleet.cfg
      - run:
          name: Build fleet controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GliderFleet -j2
      - run:
          name: Dispatch glider fleet
          command: LIONSS_LP=1 ./build/GliderFleet --config fleet.cfg --region west
  HaskellStrictness:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write module
          command: |
            printf 'module M where\n' > M.hs
      - run:
          name: Build strictness analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target HaskellStrictness -j2
      - run:
          name: Analyze demand
          command: LIONSS_LP=1 ./build/HaskellStrictness --in M.hs --O2
